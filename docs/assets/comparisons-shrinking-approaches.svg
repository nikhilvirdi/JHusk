<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="box-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    
    <!-- Light grey arrow marker with refX=8 (exact tip placement) -->
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .node-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; filter: url(#box-shadow); }
    .node-terminal { fill: #f8fafc; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 3; filter: url(#box-shadow); }
    .op-box { fill: rgba(15, 23, 42, 0.7); stroke: #94a3b8; stroke-width: 1.1; stroke-dasharray: 2 2; filter: url(#box-shadow); }
    .edge-line { fill: none; stroke: #64748b; stroke-width: 1.2; }
    .divider-line { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .text-title { fill: #1e293b; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .text-sub { fill: #475569; font-size: 12px; font-weight: 400; text-anchor: middle; }
    .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #334155; }
    .text-op { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #e2e8f0; font-weight: 500; text-anchor: middle; }
  </style>

  <!-- ================= VERTICAL DIVIDER ================= -->
  <line x1="360" y1="20" x2="360" y2="445" class="divider-line"/>

  <!-- ================= LEFT COLUMN: jqwik ================= -->
  <!-- Header -->
  <text x="180" y="32" class="text-title">Integrated (jqwik)</text>
  <text x="180" y="49" class="text-sub">generator-coupled shrinking</text>

  <!-- Connectors Left -->
  <!-- Box L1 -> Box L2 (starts y=124, ends exactly at Box L2 top y=210) -->
  <line x1="180" y1="124" x2="180" y2="210" class="edge-line" marker-end="url(#arrow-grey)"/>

  <!-- Box L2 -> Box L3 (starts y=300, ends exactly at Box L3 top y=354) -->
  <line x1="180" y1="300" x2="180" y2="354" class="edge-line" marker-end="url(#arrow-grey)"/>

  <!-- Left Op Badge -->
  <rect x="75" y="155" width="210" height="24" rx="4" class="op-box"/>
  <text x="180" y="171" class="text-op">manual per-field shrinking</text>

  <!-- Box L1: Generator<Point> (y=70..124) -->
  <rect x="40" y="70" width="280" height="54" rx="6" class="node-box"/>
  <text x="180" y="92" class="text-title"><tspan class="text-code">Generator&lt;Point&gt;</tspan></text>
  <text x="180" y="109" class="text-sub">composite custom generator</text>

  <!-- Box L2: Manual Shrink Logic (y=210..300) -->
  <rect x="40" y="210" width="280" height="90" rx="6" class="node-box"/>
  <text x="65" y="235" class="text-code" text-anchor="start">├─ own shrink logic for x</text>
  <text x="65" y="260" class="text-code" text-anchor="start">├─ own shrink logic for y</text>
  <text x="65" y="285" class="text-code" text-anchor="start">└─ must combine both by hand</text>

  <!-- Box L3: Outcome (y=354..434) -->
  <rect x="40" y="354" width="280" height="80" rx="6" class="node-box"/>
  <text x="180" y="380" class="text-title">Author Writes Shrinking</text>
  <text x="180" y="400" class="text-sub">shrinking quality depends on</text>
  <text x="180" y="418" class="text-sub">manual per-generator logic</text>

  <!-- ================= RIGHT COLUMN: JHusk ================= -->
  <!-- Header -->
  <text x="540" y="32" class="text-title">Byte-stream (JHusk)</text>
  <text x="540" y="49" class="text-sub">generic byte-level engine</text>

  <!-- Connector Right: Box R1 -> Box R2 (starts y=124, ends exactly at Box R2 top y=240) -->
  <line x1="540" y1="124" x2="540" y2="240" class="edge-line" marker-end="url(#arrow-grey)"/>

  <!-- Right Op Badge -->
  <rect x="415" y="170" width="250" height="24" rx="4" class="op-box"/>
  <text x="540" y="186" class="text-op">no shrink logic needed here</text>

  <!-- Box R1: Generator<Point> (y=70..124) -->
  <rect x="400" y="70" width="280" height="54" rx="6" class="node-box"/>
  <text x="540" y="92" class="text-title"><tspan class="text-code">Generator&lt;Point&gt;</tspan></text>
  <text x="540" y="109" class="text-sub">standard composed generator</text>

  <!-- Box R2: Generic Byte-Stream Shrinking (y=240..434) -->
  <rect x="400" y="240" width="280" height="194" rx="6" class="node-terminal"/>
  <text x="540" y="274" class="text-title">Shrinks For Free</text>
  <text x="540" y="304" class="text-sub">Shrinking happens once,</text>
  <text x="540" y="324" class="text-sub">generically, on the underlying</text>
  <text x="540" y="344" class="text-sub">byte stream itself.</text>
  <text x="540" y="380" class="text-sub">Every composed generator gets</text>
  <text x="540" y="400" class="text-sub">optimal minimal failures automatically.</text>
</svg>
