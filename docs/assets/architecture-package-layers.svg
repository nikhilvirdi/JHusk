<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="box-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    
    <!-- Light grey arrow marker -->
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .node-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; filter: url(#box-shadow); }
    .op-box { fill: rgba(15, 23, 42, 0.7); stroke: #94a3b8; stroke-width: 1.1; stroke-dasharray: 2 2; filter: url(#box-shadow); }
    .edge-line { fill: none; stroke: #64748b; stroke-width: 1.2; }
    .text-title { fill: #1e293b; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .text-sub { fill: #475569; font-size: 12px; font-weight: 400; text-anchor: middle; }
    .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #334155; }
    .text-op { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #e2e8f0; font-weight: 500; text-anchor: middle; }
  </style>

  <!-- ================= CONNECTORS & ARROWS ================= -->

  <!-- Top -> Middle Arrow (from y=88 down to y=186, landing at y=192) -->
  <line x1="320" y1="88" x2="320" y2="186" class="edge-line" marker-end="url(#arrow-grey)"/>

  <!-- Middle -> Bottom Arrow (from y=256 down to y=354, landing at y=360) -->
  <line x1="320" y1="256" x2="320" y2="354" class="edge-line" marker-end="url(#arrow-grey)"/>

  <!-- ================= OPERATION BADGES ================= -->

  <!-- Op 1: depends on (y=128..152) -->
  <rect x="245" y="128" width="150" height="24" rx="4" class="op-box"/>
  <text x="320" y="144" class="text-op">depends on</text>

  <!-- Op 2: depends on (y=296..320) -->
  <rect x="245" y="296" width="150" height="24" rx="4" class="op-box"/>
  <text x="320" y="312" class="text-op">depends on</text>

  <!-- ================= NODES ================= -->

  <!-- Top Layer: junit/ (y=24..88) -->
  <rect x="120" y="24" width="400" height="64" rx="6" class="node-box"/>
  <text x="320" y="50" class="text-title"><tspan class="text-code">junit/</tspan> (@Property glue)</text>
  <text x="320" y="70" class="text-sub">@Property, @ForAll, PropertyExtension</text>

  <!-- Middle Layer: Root Package (y=192..256) -->
  <rect x="120" y="192" width="400" height="64" rx="6" class="node-box"/>
  <text x="320" y="218" class="text-title">Root Package (Public API)</text>
  <text x="320" y="238" class="text-sub">Generator, Generators, Property, FailureStorage</text>

  <!-- Bottom Layer: internal/ (y=360..424) -->
  <rect x="120" y="360" width="400" height="64" rx="6" class="node-box"/>
  <text x="320" y="386" class="text-title"><tspan class="text-code">internal/</tspan> (The Engine)</text>
  <text x="320" y="406" class="text-sub">DataSource, Span, Shrinker, ShrinkHarness</text>
</svg>
